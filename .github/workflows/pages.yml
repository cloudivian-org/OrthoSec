# Publishes the OrthoSec docs site + a sample HTML report to GitHub Pages.
#
# The sample report (docs/sample-report.html) is a real product output committed to the
# repo — generated locally with the executive-briefing (intel) layer enabled, which needs a
# model key. We deploy it as a static file rather than regenerating in CI so NO model key
# ever lives in Actions. Refresh it by re-running the scan locally and committing the result:
#   orthosec scan <demo> --profile ciso --html docs/sample-report.html
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Served at https://cloudivian-org.github.io/OrthoSec/
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/report
          cp site/index.html _site/index.html          # docs landing (self-contained)
          cp docs/sample-report.html _site/report/index.html   # sample report (with exec briefing)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
