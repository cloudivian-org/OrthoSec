# Publishes a live sample OrthoSec HTML report to GitHub Pages.
# The report is generated fresh from the bundled vulnerable demo on every push,
# so the published page is always a real product output, never a stale mock.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source:
#   "GitHub Actions". Then the page is served at
#   https://cloudivian-org.github.io/OrthoSec/
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OrthoSec (+ intel for the executive briefing)
        run: pip install -e ".[intel]"

      - name: Build docs site + live sample report
        env:
          # The live report includes the LLM executive briefing when a model key is set as
          # a repo secret. Without it the scan fails open to the deterministic summary — the
          # report still builds, just without the board-level narrative. Optionally set an
          # ORTHOSEC_MODEL repo variable to pick a cheaper model for this per-push sample.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ORTHOSEC_MODEL: ${{ vars.ORTHOSEC_MODEL }}
        run: |
          mkdir -p _site/report
          # Docs landing page (self-contained, theme-aware).
          cp site/index.html _site/index.html
          # Live sample report, regenerated fresh from the bundled vulnerable demo. The CISO
          # profile surfaces the executive briefing (business risk + regulatory exposure).
          orthosec scan examples/vulnerable-agent \
            --profile ciso --fail-on none \
            --html _site/report/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
