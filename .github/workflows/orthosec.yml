# OrthoSec dogfood gate — OrthoSec scans its own source on every push/PR.
#
# This gate installs the CODE IN THIS CHECKOUT (editable), not the published PyPI
# release, so it tests exactly what is being committed rather than the last tag
# (which always lags HEAD). Self-referential pattern-definition matches are
# inline-suppressed and `.orthosec.yml` excludes the intentional-vuln fixtures, so a
# HIGH+ finding here is a real regression in the product source. SARIF is uploaded to
# code scanning either way.
#
# NOTE: this is intentionally separate from the composite action (action.yml), which
# installs from PyPI and is what downstream consumers use. Dogfooding HEAD and
# integration-testing the published action are two different concerns.
name: OrthoSec

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write   # required to upload SARIF to code scanning

jobs:
  ai-security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history so --diff can compare against the PR base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OrthoSec (this checkout)
        run: |
          python -m pip install --upgrade pip
          # Language extras so the self-scan analyzes every source file precisely
          # (not regex-fallback), matching how the product actually runs.
          pip install -e ".[intel,js,ts,go,java,kotlin,csharp,ruby,php,rust]"

      - name: OrthoSec AI Security Scan (dogfood HEAD)
        run: |
          # On a PR, scan only what changed vs the base; on push, scan everything.
          DIFF=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF="--diff ${{ github.event.pull_request.base.sha }}"
          fi
          orthosec scan . \
            --profile appsec \
            --fail-on high \
            --sarif orthosec.sarif \
            --no-report --no-exec $DIFF

      - name: Upload SARIF to code scanning
        if: always()   # upload findings even when the scan fails the gate
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "orthosec.sarif"
