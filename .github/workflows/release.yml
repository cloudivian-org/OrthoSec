# Build and publish the OrthoSec container to GitHub Container Registry (GHCR)
# on every semver tag (v*) and on published releases.
# Result: ghcr.io/cloudivian-org/orthosec:<version> and :latest
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/orthosec
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Publish to PyPI via Trusted Publishing (OIDC) — no API token stored in the repo.
  # Requires a one-time trusted publisher setup on PyPI for this repo + workflow
  # (see PUBLISHING.md). Runs only on a published GitHub Release.
  publish-pypi:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/orthosec/
    permissions:
      id-token: write      # OIDC: PyPI trusted publishing + PEP 740 attestations (no token)
      contents: write      # attach the built artifacts to the GitHub Release
      attestations: write  # SLSA build-provenance attestation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Attach artifacts to the GitHub Release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # Trusted Publishing (OIDC) + PEP 740 attestations (default on with id-token).
      # skip-existing: a re-run (or an intermittent twine retry that already landed a
      # file) is a no-op instead of a 400 "file already exists" that reds-X the job.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # Publish the Node runtime guard (@orthosec/guard) to npm on a published Release, with
  # build provenance (--provenance, OIDC). One-time setup: add an `NPM_TOKEN` repo secret
  # (an npm automation token with publish rights). The package version is whatever
  # sdk/js/package.json declares — npm rejects a duplicate, so a bump is required per publish.
  publish-npm:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC: npm provenance attestation
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Test the guard
        working-directory: sdk/js
        run: node --test

      - name: Publish to npm
        working-directory: sdk/js
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is empty or unset."
            exit 1
          fi
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
